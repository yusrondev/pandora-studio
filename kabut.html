<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabut Realistis · Three.js</title>
<style>
:root{--bg:#0b1014;--panel:rgba(245,247,248,.88);--fg:#16202a;--mut:#5b6b78;--line:rgba(22,32,42,.16);--acc:#2f6f8f;--btn:#e3e9ed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(14,20,26,.82);--fg:#dbe6ee;--mut:#8fa1ae;--line:rgba(219,230,238,.16);--acc:#7fc0df;--btn:#1d2a34}}
:root[data-theme="dark"]{--panel:rgba(14,20,26,.82);--fg:#dbe6ee;--mut:#8fa1ae;--line:rgba(219,230,238,.16);--acc:#7fc0df;--btn:#1d2a34}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#panel{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:276px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#panel.hide .body{display:none}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
#tg{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.row{margin:10px 0 0}
.row label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.row label b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);margin:3px 0 0}
.color{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-top:12px}
input[type=color]{width:44px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btns button{flex:1 1 auto;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.btns button:hover{border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:12px}
.hint{font-size:11.5px;color:var(--mut);margin:12px 0 2px;line-height:1.4}
@media (max-width:560px){#panel{width:calc(100% - 24px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="head"><h1>Pengaturan kabut</h1><button id="tg">Tutup</button></div>
  <div class="body">
    <div id="sl"></div>
    <div class="color"><span>Warna kabut</span><input type="color" id="col" value="#9fb4c4"></div>
    <div class="color"><span>Warna cahaya</span><input type="color" id="lcol" value="#ffb561"></div>
    <label class="chk"><input type="checkbox" id="auto"> Putar kamera otomatis</label>
    <div class="btns" id="pre"></div>
    <div class="btns"><button id="rnd">Acak ulang</button><button id="rst">Reset</button></div>
    <div class="hint">Seret untuk memutar, scroll atau cubit untuk zoom.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const MAX = 6000;
const DEF = {count:1800,size:11,opacity:0.07,height:5,area:90,speed:0.6,wind:40,turb:1.2,world:0.022,light:1.6,range:9,exposure:1};
const CFG = [
  ['count','Jumlah kabut',0,MAX,50,0],
  ['size','Ukuran gumpalan',3,30,0.5,1],
  ['opacity','Ketebalan',0,0.25,0.005,3],
  ['height','Tinggi lapisan',0.5,16,0.1,1],
  ['area','Luas sebaran',20,200,5,0],
  ['speed','Kecepatan gerak',0,3,0.05,2],
  ['wind','Arah angin (°)',0,360,5,0],
  ['turb','Gejolak',0,4,0.1,1],
  ['light','Cahaya dalam kabut',0,4,0.1,1],
  ['range','Jangkauan cahaya',2,30,0.5,1],
  ['exposure','Kecerahan',0.3,2,0.05,2]
];
const P = Object.assign({}, DEF);
let fogHex = '#9fb4c4', lightHex = '#ffb561';

// ---------- renderer & scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

// Hanya kabut: tidak ada objek lain. Titik ini hanya posisi cahaya tak terlihat di dalam kabut.
const LANTERN = new THREE.Vector3(0, 2.2, 0);

// ---------- tekstur gumpalan kabut (noise fbm) ----------
function makeTexture(){
  const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);
  const G = 16, grid = new Float32Array(G*G*4); // beberapa oktaf nilai acak
  const rnd = new Float32Array(64*64); for (let i=0;i<rnd.length;i++) rnd[i]=Math.random();
  const sm = t => t*t*(3-2*t);
  function vn(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=sm(x-xi), yf=sm(y-yi);
    const h=(a,b)=>rnd[((b&63)*64)+(a&63)];
    const a=h(xi,yi), b=h(xi+1,yi), c=h(xi,yi+1), e=h(xi+1,yi+1);
    return a+(b-a)*xf+(c-a)*yf+(a-b-c+e)*xf*yf; }
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const u=x/N, v=y/N; let f=0, amp=.5, fr=3;
    for (let o=0;o<5;o++){ f += amp*vn(u*fr+o*7.3, v*fr+o*3.1); amp*=.5; fr*=2; }
    const r = Math.hypot(u-.5, v-.5)*2;
    let fall = Math.max(0, 1-r); fall = fall*fall*(3-2*fall);
    const a = Math.max(0, Math.min(1, (f-.28)*1.9)) * fall;
    const k = (y*N+x)*4; img.data[k]=img.data[k+1]=img.data[k+2]=255*a; img.data[k+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(cv); t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4;
  return t;
}

// ---------- kabut: instanced quad billboard ----------
const base = new THREE.PlaneBufferGeometry(1, 1);
const geo = new THREE.InstancedBufferGeometry();
geo.index = base.index;
geo.setAttribute('position', base.attributes.position);
const offA = new THREE.InstancedBufferAttribute(new Float32Array(MAX*3), 3);
const varA = new THREE.InstancedBufferAttribute(new Float32Array(MAX*2), 2);
geo.setAttribute('aOff', offA); geo.setAttribute('aVar', varA);
function reseed(){
  for (let i=0;i<MAX;i++){
    offA.array[i*3]=Math.random(); offA.array[i*3+1]=Math.pow(Math.random(),1.4); offA.array[i*3+2]=Math.random();
    varA.array[i*2]=Math.random(); varA.array[i*2+1]=Math.random();
  }
  offA.needsUpdate = varA.needsUpdate = true;
}
reseed();

const U = {
  uTex:{value:makeTexture()}, uTime:{value:0}, uSize:{value:11}, uHeight:{value:5},
  uBox:{value:new THREE.Vector3(90,1,90)}, uWind:{value:new THREE.Vector2(1,0)}, uTurb:{value:1},
  uColor:{value:new THREE.Color(fogHex)}, uLightColor:{value:new THREE.Color(lightHex)},
  uLightPos:{value:LANTERN.clone()}, uLightRange:{value:9}, uLightInt:{value:1.6}, uOpacity:{value:.07}, uExp:{value:1}
};
const mat = new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, depthTest:true,
  vertexShader:`
    attribute vec3 aOff; attribute vec2 aVar;
    uniform float uTime,uSize,uHeight,uTurb,uLightRange;
    uniform vec3 uBox,uLightPos; uniform vec2 uWind;
    varying vec2 vUv; varying float vA,vLit;
    void main(){
      float s = aVar.y;
      vec2 xz = fract(aOff.xz + uWind*uTime*(0.5+s)/uBox.xz);
      float h = aOff.y;
      vec3 wp = vec3((xz.x-.5)*uBox.x, h*uHeight, (xz.y-.5)*uBox.z);
      wp.x += sin(uTime*.23+s*40.)*uTurb;
      wp.z += cos(uTime*.19+s*27.)*uTurb;
      wp.y += sin(uTime*.31+s*53.)*.35*uTurb;
      float edge = smoothstep(0.,.14,xz.x)*smoothstep(1.,.86,xz.x)*smoothstep(0.,.14,xz.y)*smoothstep(1.,.86,xz.y);
      vA = edge*pow(sin(clamp(h,.02,.98)*3.14159), .6);
      vec4 mv = viewMatrix*vec4(wp,1.);
      float sz = uSize*(.55+.9*aVar.x);
      float ang = s*6.2831 + uTime*.04*(s-.5)*4.;
      float c=cos(ang), sn=sin(ang);
      vec2 q = position.xy*sz;
      mv.xy += vec2(c*q.x - sn*q.y, sn*q.x + c*q.y);
      vUv = position.xy + .5;
      vA *= smoothstep(.4, 5., -mv.z);
      vLit = exp(-distance(wp,uLightPos)/uLightRange);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D uTex; uniform vec3 uColor,uLightColor;
    uniform float uOpacity,uLightInt,uExp;
    varying vec2 vUv; varying float vA,vLit;
    void main(){
      float a = texture2D(uTex, vUv).r * vA * uOpacity;
      vec3 col = (uColor + uLightColor*uLightInt*vLit*1.6) * uExp;
      gl_FragColor = vec4(col, a);
    }`
});
const fog = new THREE.Mesh(geo, mat); fog.frustumCulled = false; scene.add(fog);

// ---------- parameter -> uniform ----------
function apply(){
  geo.instanceCount = Math.floor(P.count);
  U.uSize.value = P.size; U.uHeight.value = P.height;
  U.uBox.value.set(P.area, 1, P.area);
  const a = P.wind*Math.PI/180; U.uWind.value.set(Math.cos(a)*1.4, Math.sin(a)*1.4);
  U.uTurb.value = P.turb; U.uOpacity.value = P.opacity;
  U.uLightInt.value = P.light; U.uLightRange.value = P.range; U.uExp.value = P.exposure;
  U.uColor.value.set(fogHex); U.uLightColor.value.set(lightHex);
  scene.background = new THREE.Color(fogHex).multiplyScalar(.07);
}

// ---------- UI ----------
const sl = document.getElementById('sl'), els = {};
CFG.forEach(([k,label,min,max,step,dec])=>{
  const r = document.createElement('div'); r.className='row';
  r.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${min}" max="${max}" step="${step}">`;
  const inp = r.querySelector('input'), out = r.querySelector('b');
  const show = ()=>{ out.textContent = (+P[k]).toFixed(dec); inp.value = P[k]; };
  inp.addEventListener('input', ()=>{ P[k] = +inp.value; show(); apply(); });
  els[k] = show; show(); sl.appendChild(r);
});
const colEl = document.getElementById('col'), lcolEl = document.getElementById('lcol');
colEl.oninput = ()=>{ fogHex = colEl.value; apply(); };
lcolEl.oninput = ()=>{ lightHex = lcolEl.value; apply(); };
function setAll(o, fc, lc){
  Object.assign(P, o); if (fc){ fogHex = fc; colEl.value = fc; } if (lc){ lightHex = lc; lcolEl.value = lc; }
  Object.keys(els).forEach(k=>els[k]()); apply();
}
const PRESETS = {
  'Tipis':   [{count:900, size:9, opacity:.035, height:3, world:.01, light:1.2}, '#b8c7d4', '#ffb561'],
  'Sedang':  [DEF, '#9fb4c4', '#ffb561'],
  'Tebal':   [{count:3800, size:14, opacity:.1, height:7, world:.04, light:2.2, speed:.4}, '#a9b8c4', '#ffb561'],
  'Mistis':  [{count:3000, size:16, opacity:.09, height:9, world:.03, light:2.6, speed:.35, turb:2}, '#8a9be0', '#ff8ad8']
};
const pre = document.getElementById('pre');
Object.keys(PRESETS).forEach(n=>{
  const b = document.createElement('button'); b.textContent = n;
  b.onclick = ()=>{ const [o,f,l] = PRESETS[n]; setAll(Object.assign({}, DEF, o), f, l); };
  pre.appendChild(b);
});
document.getElementById('rnd').onclick = reseed;
document.getElementById('rst').onclick = ()=>setAll(DEF, '#9fb4c4', '#ffb561');
const panel = document.getElementById('panel'), tg = document.getElementById('tg');
tg.onclick = ()=>{ panel.classList.toggle('hide'); tg.textContent = panel.classList.contains('hide') ? 'Buka' : 'Tutup'; };
if (innerWidth < 560){ panel.classList.add('hide'); tg.textContent = 'Buka'; }
const autoEl = document.getElementById('auto');

// ---------- kamera orbit ----------
let theta = .6, phi = 1.38, radius = 16, tTheta = theta, tPhi = phi, tRad = radius, drag = false, lx = 0, ly = 0;
const pts = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); drag = true; lx=e.clientX; ly=e.clientY; });
canvas.addEventListener('pointerup', e=>{ pts.delete(e.pointerId); if (!pts.size) drag=false; pinch=0; });
canvas.addEventListener('pointermove', e=>{
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  if (pts.size === 2){ const [a,b] = [...pts.values()]; const dd = Math.hypot(a[0]-b[0], a[1]-b[1]); if (pinch) tRad *= pinch/dd; pinch = dd; return; }
  tTheta -= (e.clientX-lx)*.006; tPhi = Math.max(.25, Math.min(1.52, tPhi - (e.clientY-ly)*.005)); lx=e.clientX; ly=e.clientY;
});
canvas.addEventListener('wheel', e=>{ e.preventDefault(); tRad *= 1 + Math.sign(e.deltaY)*.08; }, {passive:false});

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- loop ----------
const clock = new THREE.Clock(); let t = 0;
const target = new THREE.Vector3(0, 2.2, 0);
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  t += dt*P.speed; U.uTime.value = t;
  if (autoEl.checked && !drag) tTheta += dt*.08;
  tRad = Math.max(2.5, Math.min(60, tRad));
  theta += (tTheta-theta)*.1; phi += (tPhi-phi)*.1; radius += (tRad-radius)*.1;
  camera.position.set(target.x + radius*Math.sin(phi)*Math.sin(theta), Math.max(.6, target.y + radius*Math.cos(phi)), target.z + radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
apply(); frame();
})();
</script>
</body>
</html>
