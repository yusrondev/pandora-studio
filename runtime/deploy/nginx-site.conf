server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEBROOT__;
    index index.html;

    # File model 3D besar: dikompres saat dikirim
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm model/gltf+json application/octet-stream;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        font/woff2 woff2;
        model/gltf-binary glb;
        application/octet-stream fbx;
        text/plain txt;
    }

    # Halaman utama selalu dicek ulang agar build baru langsung terpakai
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aset memakai ?v=<build> atau jarang berubah
    location ~* \.(js|css|woff2|wasm|fbx|glb|json)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Skrip deploy dan peluncur lokal tidak perlu tersedia di web
    location ~ ^/(deploy/|Play\.bat|play-server\.ps1|play\.sh|pandora-build\.json) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
