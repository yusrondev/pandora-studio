<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Water – Realistic Hull Waves & Kelvin Wake</title>
<style>
:root{--panel:rgba(255,255,255,.82);--text:#10202e;--accent:#1a7fb5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(12,22,32,.78);--text:#e6f1f8;--accent:#5cc2f2}}
:root[data-theme="dark"]{--panel:rgba(12,22,32,.78);--text:#e6f1f8;--accent:#5cc2f2}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1620;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px;border-radius:12px;background:var(--panel);color:var(--text);backdrop-filter:blur(8px);font-size:12px;display:grid;gap:6px;min-width:210px;z-index:10}
#ui label{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px}
#ui input{width:100%;accent-color:var(--accent)}
#hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px #000a;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="hint"><b>WASD / Panah</b>: Gerakkan Objek 3D &nbsp;|&nbsp; <b>Spasi</b>: Loncat (Tes Hantaman Gelombang) &nbsp;|&nbsp; <b>Mouse</b>: Kamera</div>
<div id="ui">
  <label>Tinggi<input id="amp" type="range" min="0.1" max="1.5" step="0.05" value="0.7"></label>
  <label>Kecepatan<input id="spd" type="range" min="0.1" max="3" step="0.05" value="1"></label>
  <label>Ombak tajam<input id="chop" type="range" min="0" max="1.2" step="0.05" value="0.8"></label>
  <label>Matahari<input id="sun" type="range" min="3" max="80" step="1" value="22"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 3000);
const sunDir = new THREE.Vector3();

// Riwayat jejak: tiap sampel memancarkan riak melingkar -> gabungannya membentuk pola Kelvin (V) alami
const TRAIL_MAX = 40;
const trailPos = [], trailDir = [];
for(let i=0; i<TRAIL_MAX; i++){
  trailPos.push(new THREE.Vector4(0, 0, -999, 0)); // x, z, spawnTime, intensitas
  trailDir.push(new THREE.Vector2(0, 1));
}

const U = {
  uTime:{value:0}, uAmp:{value:0.7}, uSpeed:{value:1}, uChop:{value:0.8},
  uSun:{value:sunDir},
  uTrailPos:{value:trailPos}, uTrailDir:{value:trailDir},
  uObjPos:{value:new THREE.Vector3()},
  uObjDir:{value:new THREE.Vector2(0, 1)},
  uObjSize:{value:new THREE.Vector2(1.25, 2.6)},
  uObjSpd:{value:0}, uSubmerge:{value:1}
};

function getWaveHeightAndNormal(x, z, time, amp, speed, chop) {
  let py = 0, nx = 0, ny = 1, nz = 0;
  const S = chop * 0.9 / 9.0 * Math.min(Math.max(amp, 0.0), 1.2);
  for(let i=0; i<9; i++){
    const a = 0.5 + Math.sin(i * 12.9898 + 1.3) * 0.85;
    const dx = Math.cos(a), dz = Math.sin(a);
    const L = 95.0 * Math.pow(0.64, i), k = 6.28318 / L;
    const A = amp * L * 0.014;
    const ph = (dx * x + dz * z) * k + time * Math.sqrt(9.8 * k) * speed + i * 1.7;
    const s = Math.sin(ph), c = Math.cos(ph);
    py += A * s; nx -= dx * k * A * c; nz -= dz * k * A * c; ny -= S * s;
  }
  const len = Math.hypot(nx, ny, nz) || 1;
  return { y: py, normal: new THREE.Vector3(nx/len, ny/len, nz/len) };
}

const common = `
uniform vec3 uSun;
uniform float uTime, uAmp, uSpeed, uChop;
uniform vec3 uObjPos;
uniform vec2 uObjDir, uObjSize;
uniform float uObjSpd, uSubmerge;
uniform vec4 uTrailPos[${TRAIL_MAX}];
uniform vec2 uTrailDir[${TRAIL_MAX}];

float sq(float x){ return x * x; }
float hash(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
const mat2 m2 = mat2(0.8, -0.6, 0.6, 0.8);
float fbm(vec2 p){
  float a = 0.5, s = 0.0;
  for(int i=0; i<4; i++){ s += a * noise(p); p = m2 * p * 2.04 + vec2(7.1, 3.7); a *= 0.5; }
  return s;
}

// SDF badan kapal (meruncing ke haluan di +forward)
float hullSDF(vec2 worldXZ, vec2 centerXZ, vec2 fwd, vec2 halfSize, out vec2 localPos){
  vec2 right = vec2(fwd.y, -fwd.x);
  vec2 rel = worldXZ - centerXZ;
  localPos = vec2(dot(rel, right), dot(rel, fwd));
  float taper = smoothstep(halfSize.y, -halfSize.y * 0.2, localPos.y);
  float hw = halfSize.x * (0.15 + 0.85 * sin(taper * 1.57079));
  vec2 d = vec2(abs(localPos.x) - hw, abs(localPos.y) - halfSize.y * 0.95);
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

// Air di sekitar lambung: x = tinggi, y = buih
vec2 hullField(vec2 q){
  vec2 lp;
  float sdf = hullSDF(q, uObjPos.xz, uObjDir, uObjSize, lp);
  if(sdf > 16.0) return vec2(0.0);
  float spd = clamp(uObjSpd * 0.12, 0.0, 1.4);
  float hy = uObjSize.y * 0.95;
  float bow = smoothstep(-hy, hy, lp.y);
  float h = 0.0, foam = 0.0;

  // air terdesak badan kapal + meniskus halus yang menempel di lambung (tanpa cincin)
  h -= smoothstep(0.3, -0.5, sdf) * 0.18 * uSubmerge;
  h += exp(-sq((sdf - 0.35) / 0.5)) * (0.07 + 0.22 * spd * bow) * uSubmerge;

  // gundukan air di depan haluan
  vec2 bp = vec2(lp.x * 0.7, lp.y - hy - 0.3);
  float bowBump = exp(-dot(bp, bp) / (1.6 + spd * 1.4));
  h += bowBump * spd * 0.42 * uSubmerge;

  // gelombang haluan berbentuk V yang melebar ke belakang
  float by = max(hy - lp.y, 0.0);
  float c = 0.5 + by * 0.30;
  float wid = 0.55 + by * 0.10;
  float u = (abs(lp.x) - c) / wid;
  float env = smoothstep(-0.6, 1.0, hy - lp.y) * exp(-by * 0.22);
  float vee = (exp(-u * u) - 0.4 * exp(-sq(u - 1.9))) * env;
  h += vee * spd * 0.30 * uSubmerge;

  // buih di garis air, haluan, dan puncak V
  foam += exp(-sq((sdf - 0.1) / (0.28 + spd * 0.12))) * (0.22 + 0.7 * spd * (0.3 + 0.7 * bow)) * uSubmerge;
  foam += bowBump * spd * 0.55 * uSubmerge;
  foam += exp(-u * u) * env * smoothstep(0.35, 1.0, spd) * 0.5 * uSubmerge;
  return vec2(h, clamp(foam, 0.0, 1.0));
}

// Jejak: riak melingkar dari tiap sampel (Kelvin wake alami). x=tinggi, y=buih, zw=gradien
vec4 wakeField(vec2 q){
  float h = 0.0, foam = 0.0;
  vec2 g = vec2(0.0);
  for(int i=0; i<${TRAIL_MAX}; i++){
    float age = uTime - uTrailPos[i].z;
    if(age <= 0.0 || age >= 3.2) continue;
    vec2 rel = q - uTrailPos[i].xy;
    float d = length(rel);
    float R = age * 3.0;
    float w = 1.1 + age * 0.55;
    float u = (d - R) / w;
    float k = 2.8;

    float a = 1.0 - age / 3.2;
    float fa = pow(a, 1.5) * uTrailPos[i].w;
    float wsh = 1.0 + age * 0.5;
    foam += exp(-d * d / (wsh * wsh * 1.8)) * fa * 0.38;

    if(abs(u) < 3.0){
      float amp = a * a * uTrailPos[i].w * 0.075 / sqrt(1.0 + R * 0.5);
      float e = exp(-u * u);
      float ph = k * (d - R);
      h += amp * e * cos(ph);
      float dd = amp * e * (-k * sin(ph) - 2.0 * u / w * cos(ph));
      g += dd * rel / max(d, 0.05);
    }
  }
  float sc = 1.0 / (1.0 + 1.2 * abs(h));
  g *= sc * sc; h *= sc;
  foam += smoothstep(0.2, 0.45, h) * 0.55;
  return vec4(h, clamp(foam, 0.0, 1.0), g);
}

vec3 skyFast(vec3 d){
  float h=clamp(d.y,0.,1.);
  float low=pow(1.-clamp(uSun.y*2.5,0.,1.),2.);
  vec3 horizon=mix(vec3(0.72,0.84,0.95),vec3(1.0,0.72,0.5),low*0.7);
  vec3 zenith=mix(vec3(0.10,0.34,0.74),vec3(0.14,0.2,0.45),low*0.5);
  vec3 c=mix(horizon,zenith,pow(h,0.4));
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.,.8,.55)*pow(s,6.)*0.3;
  return c;
}
vec3 skyColor(vec3 d){
  vec3 c=skyFast(d);
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.,.95,.85)*pow(s,1500.)*8.;
  if(d.y>0.){
    vec2 uv=d.xz/(d.y+0.18)*0.55+vec2(uTime*0.012,uTime*0.006);
    float cl=smoothstep(0.48,0.82,fbm(uv));
    float low=pow(1.-clamp(uSun.y*2.5,0.,1.),2.);
    float lit=0.75+0.5*pow(s,3.);
    vec3 cc=mix(vec3(0.62,0.68,0.78),vec3(1.,.97,.93),0.5+0.5*clamp(uSun.y*2.,0.,1.))*lit;
    cc=mix(cc,vec3(1.,.7,.5)*lit,low*0.4);
    c=mix(c,cc,cl*smoothstep(0.,0.12,d.y)*0.9);
  }
  return c;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
`;

const sky = new THREE.Mesh(new THREE.SphereGeometry(1500,32,16), new THREE.ShaderMaterial({
  uniforms:U, side:THREE.BackSide, depthWrite:false,
  vertexShader:`varying vec3 vDir; void main(){vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir; ${common}
  void main(){ vec3 c=aces(skyColor(normalize(vDir))*0.9); gl_FragColor=vec4(pow(c,vec3(1./2.2)),1.);}`
}));
scene.add(sky);

// Grid air: sangat rapat di dekat objek
const geo = new THREE.PlaneGeometry(2,2,300,300);
const pos = geo.attributes.position, HALF = 420;
for(let i=0;i<pos.count;i++){
  const u=pos.getX(i), v=pos.getY(i);
  pos.setXY(i, Math.sign(u)*Math.pow(Math.abs(u),1.9)*HALF, Math.sign(v)*Math.pow(Math.abs(v),1.9)*HALF);
}
geo.rotateX(-Math.PI/2);

const water = new THREE.Mesh(geo, new THREE.ShaderMaterial({
  uniforms:U,
  vertexShader:`
  varying vec3 vPos,vN; varying float vH,vCrestFoam;
  ${common}
  void main(){
    vec3 p0 = position + vec3(uObjPos.x, 0.0, uObjPos.z);
    vec3 p = p0, n = vec3(0.,1.,0.);
    float jxx=1.,jzz=1.,jxz=0.;
    float S=uChop*0.9/9.*clamp(uAmp,0.,1.2);
    for(int i=0;i<9;i++){
      float fi=float(i);
      float a=0.5+sin(fi*12.9898+1.3)*0.85;
      vec2 d=vec2(cos(a),sin(a));
      float L=95.*pow(0.64,fi), k=6.28318/L;
      float A=uAmp*L*0.014;
      float ph=dot(d,p0.xz)*k+uTime*sqrt(9.8*k)*uSpeed+fi*1.7;
      float s=sin(ph), c=cos(ph);
      float QA=S/k;
      p.x+=QA*d.x*c; p.z+=QA*d.y*c; p.y+=A*s;
      n.x-=d.x*k*A*c; n.z-=d.y*k*A*c; n.y-=S*s;
      jxx-=S*d.x*d.x*s; jzz-=S*d.y*d.y*s; jxz-=S*d.x*d.y*s;
    }
    if(length(p.xz - uObjPos.xz) < 65.0){
      p.y += hullField(p.xz).x + wakeField(p.xz).x;
    }
    float J=jxx*jzz-jxz*jxz;
    vCrestFoam = 1.0 - smoothstep(0.12, 0.65, J);
    vN=normalize(n); vH=p.y; vPos=p;
    gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);
  }`,
  fragmentShader:`
  varying vec3 vPos,vN; varying float vH,vCrestFoam;
  ${common}

  float hgt(vec2 p){return noise(p)*.65+noise(m2*p*2.2+3.)*.35;}
  vec2 dN(vec2 p){float e=.07,c=hgt(p);return vec2(hgt(p+vec2(e,0.))-c,hgt(p+vec2(0.,e))-c)/e;}

  float wakeFoamPattern(vec2 p){
    vec2 r = vec2(uObjDir.y, -uObjDir.x);
    p = vec2(dot(p, r) * 1.25, dot(p, uObjDir) * 0.75); // renggangkan searah gerak
    vec2 warp = vec2(noise(p * 0.8 + uTime * 0.2), noise(p * 0.8 - uTime * 0.15 + 4.1));
    p += (warp - 0.5) * 1.2;
    float n1 = noise(p * 2.5);
    float n2 = noise(m2 * p * 6.0 - uTime * 0.3);
    float web = 1.0 - abs(n2 * 2.0 - 1.0);
    return n1 * 0.5 + pow(web, 1.8) * 0.5;
  }

  void main(){
    vec3 V=normalize(cameraPosition-vPos);
    float dist=length(cameraPosition-vPos);
    vec2 q=vPos.xz;

    float wakeFoam = 0.0, wakeWaveH = 0.0;
    vec2 wakeSlope = vec2(0.0);
    if(length(q - uObjPos.xz) < 60.0){
      float e = 0.1;
      vec2 hc = hullField(q);
      float hx = hullField(q + vec2(e, 0.0)).x;
      float hz = hullField(q + vec2(0.0, e)).x;
      vec4 wk = wakeField(q);
      wakeSlope = -(vec2(hx - hc.x, hz - hc.x) / e + wk.zw);
      wakeWaveH = hc.x + wk.x;
      wakeFoam = clamp(hc.y + wk.y, 0.0, 1.0);
    }

    vec2 dt=(dN(q*0.8+uTime*vec2(.3,.1))+dN(q*1.9-uTime*vec2(.2,-.25)))*0.5;
    float fade=exp(-dist*0.014);
    float rough = 0.22 * fade + 0.3 * wakeFoam; // air beraerasi = permukaan lebih kasar
    vec3 N=normalize(vN + vec3(wakeSlope.x * 0.9 + dt.x * rough, 0.0, wakeSlope.y * 0.9 + dt.y * rough));

    vec3 R=reflect(-V,N); R.y=max(R.y, 0.015); R=normalize(R);
    float f=0.02+0.98*pow(1.-max(dot(N,V),0.),5.);
    float sunF=clamp(uSun.y*2.5,0.15,1.);

    float NdotL=dot(N,uSun);
    float waveShadow=smoothstep(-0.25,0.35,NdotL)*0.45+0.55;

    // bayangan kontak lembut di bawah/dekat lambung
    vec2 shadowCenter = uObjPos.xz - uSun.xz * max(0.0, uObjPos.y - vH) / max(0.18, uSun.y);
    vec2 sLocal;
    float shadowSDF = hullSDF(q, shadowCenter, uObjDir, uObjSize * 0.9, sLocal);
    float meshShadow = 1.0 - smoothstep(0.8, -0.4, shadowSDF) * 0.38;
    float shadow = waveShadow * meshShadow;

    vec3 deep=vec3(0.01,0.07,0.12), shallow=vec3(0.04,0.32,0.34);
    float lit=smoothstep(-1.2*uAmp, 2.0*uAmp, vH + wakeWaveH * 1.8);
    vec3 body=mix(deep,shallow,lit*0.75)*sunF*shadow;

    float back=pow(max(dot(V,-normalize(vec3(uSun.x,0.1,uSun.z))),0.),3.);
    float wakeSSS = clamp(wakeWaveH * 2.5, 0.0, 0.8);
    body+=vec3(0.08,0.52,0.44)*(back*lit + wakeSSS*0.6)*0.55*sunF*meshShadow;
    // gelembung udara tersuspensi memberi warna turquoise terang di jejak
    body = mix(body, vec3(0.10, 0.50, 0.52) * sunF, clamp(wakeFoam * 0.45, 0.0, 0.45));

    vec3 col=mix(body,skyFast(R)*meshShadow,clamp(f,0.,1.));

    vec3 H=normalize(uSun+V);
    float NdotH=max(dot(N,H),0.);
    float specVis=smoothstep(-0.05,0.2,NdotL)*meshShadow;
    float spec=(pow(NdotH,1200.)*14.+pow(NdotH,120.)*0.45)*specVis;

    float pattern = wakeFoamPattern(q * 1.5);
    float fineBubbles = noise(q * 15.0);
    float combinedFoam = max(vCrestFoam * 0.9, wakeFoam);
    float subFoam  = smoothstep(0.35, 0.78, combinedFoam * (0.4 + 0.75 * pattern));
    float coreFoam = smoothstep(0.62, 0.95, combinedFoam * (0.45 + 0.65 * pattern) * (0.65 + 0.35 * fineBubbles));

    col += vec3(1.,.93,.8)*spec*(1.-subFoam*0.8);

    vec3 underFoamCol = mix(shallow, vec3(0.50, 0.78, 0.84), 0.55) * sunF * (0.7 + 0.3 * shadow);
    vec3 topFoamCol   = vec3(0.93, 0.97, 1.0) * (0.55 + 0.45 * sunF) * (0.68 + 0.32 * shadow);
    col = mix(col, underFoamCol, subFoam * 0.55);
    col = mix(col, topFoamCol, coreFoam * 0.88);

    float fog=1.-exp(-dist*0.0012);
    col=mix(col,skyFast(normalize(vec3(V.x,0.03,V.z))),fog);
    col=aces(col*0.95);
    gl_FragColor=vec4(pow(col,vec3(1./2.2)),1.);
  }`
}));
water.frustumCulled=false;
scene.add(water);

const ambientLight = new THREE.HemisphereLight(0xdff0ff, 0x103040, 0.85);
const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.4);
scene.add(ambientLight, dirLight);

const craftGroup = new THREE.Group();
const hullGeo = new THREE.ConeGeometry(1.4, 5.2, 6);
hullGeo.rotateX(Math.PI / 2);
hullGeo.scale(1.1, 0.55, 1.0);
const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({color: 0xf43f5e, roughness: 0.25, metalness: 0.1}));
hull.position.y = 0.25;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 1.8), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.2}));
cabin.position.set(0, 0.75, -0.3);
craftGroup.add(hull, cabin);
scene.add(craftGroup);

const craft = { pos: new THREE.Vector3(0, 2, 0), vel: new THREE.Vector3(), yaw: 0, inWater: false };

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space' && craft.inWater) { craft.vel.y = 9.5; spawnSplash(craft.pos, 45, 1.5); }
});
addEventListener('keyup', e => keys[e.code] = false);

// Partikel percikan
const PARTICLE_COUNT = 260;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PARTICLE_COUNT * 3);
const pScale = new Float32Array(PARTICLE_COUNT);
const pData = [];
for(let i=0; i<PARTICLE_COUNT; i++){
  pPos[i*3+1] = -999; pScale[i] = 0;
  pData.push({ vel: new THREE.Vector3(), life: 0, maxLife: 1 });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aScale', new THREE.BufferAttribute(pScale, 1));

const splashSystem = new THREE.Points(pGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute float aScale;
    varying float vAlpha;
    void main(){
      vAlpha = clamp(aScale, 0.0, 1.0);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aScale * (140.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }`,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = dot(c, c);
      if(r > 0.25) discard;
      float a = pow(1.0 - r * 4.0, 1.5) * vAlpha * 0.75;
      gl_FragColor = vec4(0.92, 0.97, 1.0, a);
    }`
}));
splashSystem.frustumCulled = false;
scene.add(splashSystem);

let pCursor = 0;
function spawnSplash(origin, count, power = 1.0) {
  for(let i=0; i<count; i++){
    const p = pData[pCursor];
    const idx = pCursor * 3;
    const angle = Math.random() * Math.PI * 2;
    const spread = (0.4 + Math.random() * 1.5) * power;
    pPos[idx]   = origin.x + (Math.random() - 0.5) * 1.2;
    pPos[idx+1] = origin.y + 0.15;
    pPos[idx+2] = origin.z + (Math.random() - 0.5) * 1.2;
    p.vel.set(Math.cos(angle) * spread + craft.vel.x * 0.3, (2.2 + Math.random() * 4.0) * power, Math.sin(angle) * spread + craft.vel.z * 0.3);
    p.life = 0.01;
    p.maxLife = 0.4 + Math.random() * 0.4;
    pCursor = (pCursor + 1) % PARTICLE_COUNT;
  }
}

// Kamera orbit
let theta=0.6, phi=1.35, radius=34, tT=theta, tP=phi, tR=radius, drag=false, lx=0, ly=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
cv.addEventListener('pointermove',e=>{if(!drag)return;tT-=(e.clientX-lx)*0.005;tP=Math.min(1.53,Math.max(0.5,tP-(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();tR=Math.min(200,Math.max(10,tR*(1+e.deltaY*0.001)))},{passive:false});

const $=id=>document.getElementById(id);
function setSun(){
  const el=THREE.MathUtils.degToRad(+$('sun').value);
  sunDir.set(Math.cos(el)*0.5,Math.sin(el),-Math.cos(el)*0.85).normalize();
  dirLight.position.copy(sunDir).multiplyScalar(100);
}
$('amp').oninput=e=>U.uAmp.value=+e.target.value;
$('spd').oninput=e=>U.uSpeed.value=+e.target.value;
$('chop').oninput=e=>U.uChop.value=+e.target.value;
$('sun').oninput=setSun; setSun();

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

const clock = new THREE.Clock();
let lastTime = 0, trailIdx = 0;
const lastTrailSpawnPos = new THREE.Vector2(999, 999);
const upVec = new THREE.Vector3(0, 1, 0);
const targetQuat = new THREE.Quaternion();
const rotMat = new THREE.Matrix4();

(function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  const dt = Math.min(t - lastTime, 0.05);
  lastTime = t;
  U.uTime.value = t;

  const turn = (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0) - (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);
  const thrust = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);

  craft.yaw += turn * 2.2 * dt;
  const forward = new THREE.Vector3(Math.sin(craft.yaw), 0, Math.cos(craft.yaw));

  if(thrust !== 0) {
    craft.vel.x += forward.x * thrust * 24.0 * dt;
    craft.vel.z += forward.z * thrust * 24.0 * dt;
  }

  const wCenter = getWaveHeightAndNormal(craft.pos.x, craft.pos.z, t, U.uAmp.value, U.uSpeed.value, U.uChop.value);
  const wBow    = getWaveHeightAndNormal(craft.pos.x + forward.x * 2.2, craft.pos.z + forward.z * 2.2, t, U.uAmp.value, U.uSpeed.value, U.uChop.value);
  const wStern  = getWaveHeightAndNormal(craft.pos.x - forward.x * 2.2, craft.pos.z - forward.z * 2.2, t, U.uAmp.value, U.uSpeed.value, U.uChop.value);
  const waterLevel = (wCenter.y * 0.5 + (wBow.y + wStern.y) * 0.25);

  if(craft.pos.y <= waterLevel + 0.65) {
    if(!craft.inWater && craft.vel.y < -3.5) {
      spawnSplash(craft.pos, 45, Math.min(1.8, -craft.vel.y * 0.2));
      trailPos[trailIdx].set(craft.pos.x, craft.pos.z, t, 1.4);
      trailDir[trailIdx].set(forward.x, forward.z);
      trailIdx = (trailIdx + 1) % TRAIL_MAX;
    }
    craft.inWater = true;
    const depth = (waterLevel + 0.15) - craft.pos.y;
    craft.vel.y += (depth * 32.0 - craft.vel.y * 6.5) * dt;
  } else {
    craft.inWater = false;
    craft.vel.y -= 18.0 * dt;
  }

  craft.vel.x *= Math.pow(0.18, dt);
  craft.vel.z *= Math.pow(0.18, dt);
  craft.pos.addScaledVector(craft.vel, dt);

  const horizSpeed = Math.hypot(craft.vel.x, craft.vel.z);

  const tiltNormal = wCenter.normal.clone().lerp(upVec, 0.35).normalize();
  const lookTarget = craft.pos.clone().add(forward);
  lookTarget.y += (wBow.y - wStern.y) * 0.35 + (thrust > 0 ? 0.22 : 0);
  rotMat.lookAt(craft.pos, lookTarget, tiltNormal);
  targetQuat.setFromRotationMatrix(rotMat);
  craftGroup.quaternion.slerp(targetQuat, 0.16);
  craftGroup.position.copy(craft.pos);

  U.uObjPos.value.copy(craft.pos);
  U.uObjDir.value.set(forward.x, forward.z);
  U.uObjSpd.value = horizSpeed;
  U.uSubmerge.value = THREE.MathUtils.clamp(1.2 - Math.abs(craft.pos.y - waterLevel) * 0.5, 0.0, 1.0);

  // Sampel jejak berbasis jarak tempuh (tiap ~1 m), dipancarkan dari bagian belakang lambung
  const distMoved = Math.hypot(craft.pos.x - lastTrailSpawnPos.x, craft.pos.z - lastTrailSpawnPos.y);
  if(craft.inWater && distMoved > 1.0) {
    trailPos[trailIdx].set(
      craft.pos.x - forward.x * 0.6,
      craft.pos.z - forward.z * 0.6,
      t,
      Math.min(1.2, horizSpeed * 0.11 + 0.2)
    );
    trailDir[trailIdx].set(forward.x, forward.z);
    trailIdx = (trailIdx + 1) % TRAIL_MAX;
    lastTrailSpawnPos.set(craft.pos.x, craft.pos.z);

    if(horizSpeed > 3.5) {
      const bowPos = craft.pos.clone().addScaledVector(forward, 2.2);
      bowPos.y = wBow.y;
      spawnSplash(bowPos, 2, horizSpeed * 0.055);
    }
  }

  for(let i=0; i<PARTICLE_COUNT; i++){
    const p = pData[i];
    if(p.life > 0){
      p.life += dt;
      if(p.life >= p.maxLife){
        p.life = 0; pScale[i] = 0; pPos[i*3+1] = -999;
      } else {
        const idx = i * 3;
        p.vel.y -= 16.0 * dt;
        pPos[idx]   += p.vel.x * dt;
        pPos[idx+1] += p.vel.y * dt;
        pPos[idx+2] += p.vel.z * dt;
        pScale[i] = Math.sin((1.0 - p.life / p.maxLife) * Math.PI);
      }
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aScale.needsUpdate = true;

  if(!drag && thrust === 0) tT += 0.0004;
  theta += (tT - theta) * 0.08;
  phi   += (tP - phi)   * 0.08;
  radius+= (tR - radius)* 0.08;

  camera.position.set(
    craft.pos.x + radius * Math.sin(phi) * Math.sin(theta),
    Math.max(2.5, radius * Math.cos(phi) + 4),
    craft.pos.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(craft.pos.x, 1.2, craft.pos.z);
  sky.position.copy(camera.position);

  renderer.render(scene, camera);
})();
</script>
