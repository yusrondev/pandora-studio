// Diisi oleh api/android-build.php: __APP_ID__, __VERSION_CODE__, __VERSION_NAME__.
// Tanda tangan rilis dikirim lewat -Pandroid.injected.signing.* sehingga kata sandi tidak tertulis di sini.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pandora.game'
    compileSdk 34

    defaultConfig {
        applicationId '__APP_ID__'
        minSdk 26
        targetSdk 34
        versionCode __VERSION_CODE__
        versionName '__VERSION_NAME__'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Aset game sudah terenkripsi (tidak bisa dikompres lagi); disimpan apa adanya agar cepat dibaca
    androidResources {
        noCompress 'bin', 'wasm'
    }
}
