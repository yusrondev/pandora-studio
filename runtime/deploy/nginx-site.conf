# Membatasi pengambilan massal paket aset per alamat IP
limit_req_zone $binary_remote_addr zone=packs___ZONE__:5m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEBROOT__;
    index index.html;
    server_tokens off;

    # Paket aset sudah terenkripsi dan tidak bisa dikompres lagi
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        font/woff2 woff2;
        application/octet-stream bin;
        text/plain txt;
    }

    # Header dipasang di tiap blok karena add_header di dalam location menimpa milik server
    include __SECURITY_SNIPPET__;

    # Skrip deploy dan peluncur lokal tidak tersedia di web
    location ~ ^/(deploy/|README\.txt|Deploy-ke-VPS\.bat|Play\.bat|play-server\.ps1|play\.sh|pandora-build\.json) {
        return 404;
    }

    # Paket aset hanya bisa diambil lewat URL bertanda tangan yang masih berlaku
    location ^~ /data/p/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=packs___ZONE__ burst=60 nodelay;
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri __LINK_SECRET__";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        include __SECURITY_SNIPPET__;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Halaman utama selalu dicek ulang agar build baru langsung terpakai
    location = /index.html {
        include __SECURITY_SNIPPET__;
        add_header Cache-Control "no-cache";
    }

    # Aset memakai ?v=<build>
    location ~* \.(js|css|woff2|wasm)$ {
        include __SECURITY_SNIPPET__;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
